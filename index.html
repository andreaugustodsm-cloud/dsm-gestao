  const rotulos = { desvio: 'Desvio', acao: 'Ação', nc: 'NC Fornecedor', sqm: 'SQM' };
  const cores = { desvio: 'var(--danger)', acao: 'var(--warn)', nc: 'var(--purple)', sqm: 'var(--teal)' };

  if (itens.length === 0) {
    return `
      <div class="p-6">
        <div class="bg-white rounded-lg border p-12 text-center" style="border-color: var(--border);">
          <i data-lucide="trash-2" class="w-10 h-10 mx-auto mb-3" style="color: var(--text-3);"></i>
          <h3 class="font-semibold mb-1">A lixeira está vazia</h3>
          <p class="text-sm" style="color: var(--text-2);">Cards excluídos aparecem aqui e podem ser restaurados.</p>
        </div>
      </div>
    `;
  }

  return `
    <div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm" style="color: var(--text-2);">
          ${itens.length} ${itens.length === 1 ? 'item guardado' : 'itens guardados'}. Restaure o que precisar ou apague de vez.
        </p>
        <button onclick="esvaziarLixeira()" class="btn btn-secondary text-xs" style="color: var(--danger);">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          Esvaziar lixeira
        </button>
      </div>

      <div class="space-y-2">
        ${itens.map(it => `
          <div class="bg-white rounded-lg border p-4 flex items-center gap-4" style="border-color: var(--border);">
            <div class="w-1 h-10 rounded-full flex-shrink-0" style="background: ${cores[it.tipoOriginal] || 'var(--text-3)'};"></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <span class="tag" style="background: var(--surface-2); color: var(--text-2);">${rotulos[it.tipoOriginal] || it.tipoOriginal}</span>
                <span class="text-xs mono" style="color: var(--text-3);">${escapeHtml(it.numero || '')}</span>
              </div>
              <div class="text-sm font-medium truncate">${escapeHtml(it.titulo || '')}</div>
              <div class="text-xs mt-0.5" style="color: var(--text-3);">
                Excluído em ${formatDate(it.excluidoEm)} por ${escapeHtml((it.excluidoPor || '').split('@')[0])}
              </div>
            </div>
            <button onclick="restaurarDaLixeira('${it.id}')" class="btn btn-secondary text-xs">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
              Restaurar
            </button>
            <button onclick="apagarDaLixeira('${it.id}')" class="btn-ghost p-2 rounded" title="Apagar definitivamente" style="color: var(--danger);">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function restaurarDaLixeira(idLixeira) {
  const itens = state.data.lixeira || [];
  const item = itens.find(i => i.id === idLixeira);
  if (!item) return;

  const destino = { desvio: 'desvios', acao: 'acoes', nc: 'nc', sqm: 'sqm' }[item.tipoOriginal];
  if (!destino) { showToast('Não consegui identificar o tipo do card'); return; }

  state.data[destino] = state.data[destino] || [];
  if (state.data[destino].some(c => c.id === item.card.id)) {
    showToast('Já existe um card com esse número no quadro');
    return;
  }
  state.data[destino].push(item.card);
  state.data.lixeira = itens.filter(i => i.id !== idLixeira);

  saveData();
  if (apiConfigurada()) {
    enviarCard(item.tipoOriginal, item.card);
    enviarExclusao('lixeira', idLixeira);
  }
  render();
  lucide.createIcons();
  showToast(`${item.numero} restaurado`);
}

function apagarDaLixeira(idLixeira) {
  const item = (state.data.lixeira || []).find(i => i.id === idLixeira);
  if (!item) return;
  if (!confirm(`Apagar ${item.numero} definitivamente?\n\nIsso não pode ser desfeito.`)) return;

  state.data.lixeira = state.data.lixeira.filter(i => i.id !== idLixeira);
  saveData();
  if (apiConfigurada()) {
    enviarExclusao('lixeira', idLixeira);
  }
  render();
  lucide.createIcons();
  showToast('Apagado definitivamente');
}

function esvaziarLixeira() {
  const itens = state.data.lixeira || [];
  if (!itens.length) return;
  if (!confirm(`Apagar os ${itens.length} itens da lixeira definitivamente?\n\nIsso não pode ser desfeito.`)) return;

  if (apiConfigurada()) {
    itens.forEach(i => enviarExclusao('lixeira', i.id));
  }
  state.data.lixeira = [];
  saveData();
  render();
  lucide.createIcons();
  showToast('Lixeira esvaziada');
}

// =================== RELATÓRIOS ===================
function renderRelatorios() {
  const d = state.data;
  const porCriticidade = {};
  CRITICIDADES.forEach(c => porCriticidade[c.label] = d.desvios.filter(x => x.criticidade === c.id).length);
  const porUnidade = {};
  d.desvios.forEach(x => { const u = x.registro?.unidade; if (u) porUnidade[u] = (porUnidade[u] || 0) + 1; });
  const acoesPorPrio = { critica: 0, alta: 0, media: 0, baixa: 0 };
  d.acoes.forEach(x => acoesPorPrio[x.prioridade]++);
  const tempoMedio = {};
  FASES_DESVIO.forEach(f => {
    const desviosNaFase = d.desvios.filter(x => x.historico?.some(h => h.fase === f.id));
    if (desviosNaFase.length > 0) {
      const totalDias = desviosNaFase.reduce((s, x) => {
        const h = x.historico.find(hi => hi.fase === f.id);
        return s + (parseInt(h.duracao) || 0);
      }, 0);
      tempoMedio[f.label] = Math.round(totalDias / desviosNaFase.length);
    }
  });
  
  return `
    <div class="p-6 overflow-y-auto h-full space-y-4">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Desvios por criticidade -->
        <div class="bg-white rounded-lg border p-5" style="border-color: var(--border);">
          <h3 class="font-bold mb-4">Desvios por criticidade</h3>
          <div class="space-y-2">
            ${Object.entries(porCriticidade).map(([label, count]) => {
              const crit = CRITICIDADES.find(c => c.label === label);
              const max = Math.max(...Object.values(porCriticidade), 1);
              return `
                <div>
                  <div class="flex justify-between text-sm mb-1">
                    <span>${label}</span>
                    <span class="mono">${count}</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background: var(--surface-2);">
                    <div style="width: ${(count/max)*100}%; height: 100%; background: ${crit.color};"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
        
        <!-- Desvios por unidade -->
        <div class="bg-white rounded-lg border p-5" style="border-color: var(--border);">
          <h3 class="font-bold mb-4">Desvios por unidade</h3>
          <div class="space-y-2">
            ${Object.entries(porUnidade).map(([u, c]) => {
              const max = Math.max(...Object.values(porUnidade), 1);
              return `
                <div>
                  <div class="flex justify-between text-sm mb-1">
                    <span>${u}</span>
                    <span class="mono">${c}</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background: var(--surface-2);">
                    <div style="width: ${(c/max)*100}%; height: 100%; background: var(--accent);"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
        
        <!-- Tempo médio nas fases -->
        <div class="bg-white rounded-lg border p-5" style="border-color: var(--border);">
          <h3 class="font-bold mb-4">Tempo médio por fase</h3>
          <div class="space-y-2">
            ${Object.entries(tempoMedio).map(([label, dias]) => {
              const f = FASES_DESVIO.find(x => x.label === label);
              const max = Math.max(...Object.values(tempoMedio), 1);
              return `
                <div>
                  <div class="flex justify-between text-sm mb-1">
                    <span>${label}</span>
                    <span class="mono">${dias}d</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background: var(--surface-2);">
                    <div style="width: ${(dias/max)*100}%; height: 100%; background: ${f.color};"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
        
        <!-- Ações por prioridade -->
        <div class="bg-white rounded-lg border p-5" style="border-color: var(--border);">
          <h3 class="font-bold mb-4">Ações por prioridade</h3>
          <div class="space-y-2">
            ${Object.entries(acoesPorPrio).map(([prio, count]) => {
              const cores = { critica: 'var(--danger)', alta: '#EA580C', media: 'var(--warn)', baixa: 'var(--ok)' };
              const max = Math.max(...Object.values(acoesPorPrio), 1);
              return `
                <div>
                  <div class="flex justify-between text-sm mb-1">
                    <span class="capitalize">${prio}</span>
                    <span class="mono">${count}</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background: var(--surface-2);">
                    <div style="width: ${(count/max)*100}%; height: 100%; background: ${cores[prio]};"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>
      
      <div class="bg-white rounded-lg border p-5" style="border-color: var(--border);">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-bold">Exportar relatórios</h3>
          <span class="text-xs" style="color: var(--text-3);">CSV compatível com Excel/Google Sheets</span>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="exportCSV('desvios')" class="btn btn-secondary">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            Exportar Desvios (.csv)
          </button>
          <button onclick="exportCSV('acoes')" class="btn btn-secondary">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            Exportar Ações (.csv)
          </button>
          <button onclick="exportCSV('nc')" class="btn btn-secondary">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            Exportar NCs (.csv)
          </button>
          <button onclick="exportCSV('sqm')" class="btn btn-secondary">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            Exportar SQM (.csv)
          </button>
          <button onclick="exportBackup()" class="btn btn-primary">
            <i data-lucide="download-cloud" class="w-4 h-4"></i>
            Backup completo (.json)
          </button>
        </div>
      </div>
    </div>
  `;
}

function exportCSV(type) {
  const items = state.data[type];
  if (!items || items.length === 0) { showToast('Nada para exportar'); return; }
  const rows = items.map(i => {
    if (type === 'desvios') {
      const r = i.registro || {}, aq = i.avalQualidade || {}, af = i.avalFormulacao || {}, rc = i.rcaData || {};
      return {
        Numero: i.numero || i.id,
        Fase: (FASES_DESVIO.find(f => f.id === i.fase) || {}).label || i.fase,
        Titulo: r.titulo || '',
        Unidade: r.unidade || '',
        Area: aq.area || '',
        Setor: aq.setor || '',
        Categoria: aq.categoria || '',
        Tipo: aq.tipo || '',
        Criticidade: (CRITICIDADES.find(c => c.id === i.criticidade) || {}).label || '',
        Responsavel: i.responsavel || '',
        DataOcorrencia: r.dataOcorrencia || '',
        DataLimite: i.dataLimite || '',
        PrecisaFormulacao: aq.precisaFormulacao || '',
        PrecisaRCA: aq.precisaRCA || '',
        PrecisaComercial: af.precisaComercial || '',
        CausaRaiz: rc.causaRaiz || '',
        Anexos: (i.anexos || []).length,
      };
    }
    return {
      Id: i.id, Titulo: i.titulo, Fase: i.fase, Prioridade: i.prioridade,
      Setor: i.setor, Responsavel: i.responsavel, DataLimite: i.dataLimite,
      Orcamento: i.orcamento || 0, MotivoBloqueio: i.motivoBloqueio || '',
      DesvioVinculado: i.desvioVinculado || '',
    };
  });
  const keys = Object.keys(rows[0]);
  const csv = [
    keys.join(';'),
    ...rows.map(r => keys.map(k => `"${String(r[k] || '').replace(/"/g, '""')}"`).join(';'))
  ].join('\n');
  downloadFile(`rumi_${type}_${new Date().toISOString().split('T')[0]}.csv`, csv, 'text/csv');
}

// =================== BACKUP ===================

function listaPessoas() {
  return Object.keys(EMAILS_EQUIPE).filter(k => !CHAVES_FIXAS.includes(k));
}

function adicionarPessoa() {
  const nome = prompt('Nome completo da pessoa:');
  if (!nome || !nome.trim()) return;
  const limpo = nome.trim();
  if (EMAILS_EQUIPE[limpo]) { showToast('Essa pessoa já está cadastrada'); return; }

  const sugestao = limpo.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .split(' ').filter(Boolean).slice(0, 2).join('.') + '@dsm-firmenich.com';
  const email = prompt('E-mail de ' + limpo + ':', sugestao);
  if (email === null) return;

  EMAILS_EQUIPE[limpo] = (email || '').trim();
  if (!RESPONSAVEIS.includes(limpo)) RESPONSAVEIS.push(limpo);

  state.data._config = state.data._config || {};
  state.data._config.emailsEquipe = state.data._config.emailsEquipe || {};
  state.data._config.emailsEquipe[limpo] = EMAILS_EQUIPE[limpo];
  state.data._config.responsaveis = RESPONSAVEIS.slice();

  saveData();
  render();
  lucide.createIcons();
  showToast(limpo.split(' ')[0] + ' cadastrado');
}

function removerPessoa(nome) {
  if (!confirm('Remover ' + nome + ' da lista?\n\nOs cards que já têm essa pessoa como responsável não mudam.')) return;
  delete EMAILS_EQUIPE[nome];
  RESPONSAVEIS = RESPONSAVEIS.filter(r => r !== nome);

  state.data._config = state.data._config || {};
  if (state.data._config.emailsEquipe) delete state.data._config.emailsEquipe[nome];
  state.data._config.responsaveis = RESPONSAVEIS.slice();

  saveData();
  render();
  lucide.createIcons();
  showToast(nome.split(' ')[0] + ' removido');
}

function atualizarEmailEquipe(input) {
  const key = input.dataset.emailkey;
  if (!key) return;
  EMAILS_EQUIPE[key] = input.value.trim();
  state.data._config = state.data._config || {};
  state.data._config.emailsEquipe = state.data._config.emailsEquipe || {};
  state.data._config.emailsEquipe[key] = input.value.trim();
  saveData();
  showToast('E-mail atualizado');
}

function atualizarWebhook(tipo, url) {
  state.data._config = state.data._config || {};
  if (tipo === 'email') state.data._config.webhookEmail = url;
  if (tipo === 'teams') state.data._config.webhookTeams = url;
  saveData();
  showToast(url ? 'Webhook salvo (ainda não implementado — próxima release)' : 'Webhook removido');
}

function atualizarRegra(key, canal, ativo) {
  state.data._config = state.data._config || {};
  state.data._config.regras = state.data._config.regras || {};
  state.data._config.regras[key] = state.data._config.regras[key] || {};
  state.data._config.regras[key][canal] = ativo;
  saveData();
}

function exportBackup() {
  const data = { exportedAt: new Date().toISOString(), user: state.currentUser?.email, data: state.data };
  const filename = `Rumi_Backup_${new Date().toISOString().split('T')[0]}.json`;
  downloadFile(filename, JSON.stringify(data, null, 2), 'application/json');
  showToast('Backup baixado · salve no OneDrive');
}

function triggerImport() {
  document.getElementById('importFile').click();
}

function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (parsed.data && parsed.data.desvios) {
        if (!confirm('Substituir todos os dados atuais pelo backup?')) return;
        state.data = parsed.data;
        saveData();
        render();
        showToast('Backup restaurado com sucesso');
      } else {
        showToast('Arquivo inválido');
      }
    } catch(err) {
      showToast('Erro ao ler arquivo');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function downloadFile(filename, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// =================== UTILS ===================
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

function daysUntil(dateStr) {
  if (!dateStr) return 999;
  const d = new Date(dateStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  return Math.floor((d - today) / (1000 * 60 * 60 * 24));
}

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

function simulateTeamsNotification(card, oldFase, newFase, type) {
  const fases = type === 'desvio' ? FASES_DESVIO : FASES_ACAO;
  const newLabel = fases.find(f => f.id === newFase)?.label;
  setTimeout(() => {
    showToast(`📢 Teams: ${card.responsavel} notificado (${newLabel})`);
  }, 800);
}

    if (e.key === 'Enter') doLogin();

  document.getElementById('cadSenha').addEventListener('keypress', e => {

  });

  if (!apiConfigurada()) {
    console.warn('API_URL não configurada — o sistema roda em modo local, sem compartilhar dados.');
  }
});
