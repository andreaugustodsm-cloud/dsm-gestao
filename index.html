<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumi · Gestão de Desvios e Ações</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --surface-2: #F1F3F6;
    --border: #E4E7EB;
    --border-strong: #CFD3D9;
    --text: #0F1419;
    --text-2: #52606D;
    --text-3: #7B8794;
    --accent: #4338CA;
    --accent-hover: #3730A3;
    --accent-soft: #EEF0FF;
    --danger: #DC2626;
    --danger-soft: #FEE2E2;
    --warn: #D97706;
    --warn-soft: #FEF3C7;
    --ok: #059669;
    --ok-soft: #D1FAE5;
    --info: #2563EB;
    --info-soft: #DBEAFE;
    --purple: #7C3AED;
    --purple-soft: #EDE9FE;
    --teal: #0D9488;
    --teal-soft: #CCFBF1;
  }
  * { -webkit-font-smoothing: antialiased; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .rumi-logo { display: block; max-width: 100%; height: auto; aspect-ratio: 1160 / 730; border-radius: 8px; }
  .rumi-logo-login { width: 224px; margin: 0 auto 24px; }
  .rumi-logo-sidebar { width: 156px; margin: 0 auto 8px; }
  .card-shadow { box-shadow: 0 1px 2px rgba(15,20,25,0.04), 0 1px 3px rgba(15,20,25,0.06); }
  .card-shadow-lg { box-shadow: 0 4px 12px rgba(15,20,25,0.08), 0 2px 4px rgba(15,20,25,0.04); }
  .kanban-column { min-width: 300px; max-width: 300px; }

  /* Colunas com identidade visual própria por fase */
  .coluna-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--cor-fase);
    border-radius: 10px 10px 0 0;
    box-shadow: 0 1px 2px rgba(15,20,25,0.04);
  }
  .coluna-contador {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 20px; padding: 0 7px;
    border-radius: 999px; font-size: 11px; font-weight: 700;
  }
  .coluna-corpo {
    background: rgba(15, 20, 25, 0.035);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    min-height: 120px;
    box-shadow: inset 0 1px 3px rgba(15,20,25,0.05);
  }
  .coluna-corpo.drag-over {
    background: var(--accent-soft);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .coluna-vazia {
    padding: 22px 10px; text-align: center;
    font-size: 12px; color: var(--text-3);
    border: 1px dashed var(--border); border-radius: 8px;
    background: rgba(255,255,255,0.5);
  }
  .card-travado {
    outline: 2px solid var(--warn);
    outline-offset: -2px;
  }
  .selo-editando {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 6px; border-radius: 999px;
    font-size: 10px; font-weight: 600;
    background: var(--warn-soft); color: #92400E;
  }
  .kanban-scroll { scrollbar-width: thin; scrollbar-color: #CFD3D9 transparent; }
  .kanban-scroll::-webkit-scrollbar { height: 10px; width: 10px; }
  .kanban-scroll::-webkit-scrollbar-thumb { background: #CFD3D9; border-radius: 5px; }
  .kanban-scroll::-webkit-scrollbar-track { background: transparent; }
  .card-item { transition: all 0.15s ease; cursor: pointer; }
  .card-item:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,20,25,0.10); }
  .card-item.dragging { opacity: 0.5; transform: rotate(2deg); }
  .drop-zone { transition: background 0.15s; }
  .drop-zone.drag-over { background: var(--accent-soft); }
  .nav-item { transition: all 0.1s ease; }
  .nav-item:hover { background: var(--surface-2); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item.active svg { color: var(--accent); }
  .modal-backdrop { backdrop-filter: blur(4px); background: rgba(15, 20, 25, 0.4); }
  .modal-content { max-height: 90vh; overflow-y: auto; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .priority-border { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .btn { padding: 8px 14px; border-radius: 6px; font-weight: 500; font-size: 14px; transition: all 0.1s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-ghost { background: transparent; color: var(--text-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--surface); width: 100%; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .kbd { padding: 2px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; transition: all 0.2s; }
  .stat-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(15,20,25,0.06); }
  .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
  .signature-bar {
    background: linear-gradient(100deg, #3B2FA8 0%, var(--accent) 45%, var(--purple) 100%);
    color: white;
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.12);
  }
  .topbar-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px;
    color: rgba(255,255,255,0.85); transition: background 0.15s, color 0.15s;
  }
  .topbar-icon:hover { background: rgba(255,255,255,0.18); color: white; }
  .stat-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    background: rgba(255,255,255,0.12); font-weight: 500;
    transition: background 0.15s;
  }
  .stat-pill:hover { background: rgba(255,255,255,0.22); }
  .stat-pill strong { font-weight: 700; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .menu-item {
    width: 100%; display: flex; align-items: center; gap: 10px;
    padding: 9px 16px; font-size: 13.5px; text-align: left;
    transition: background 0.12s;
  }
  .menu-item:hover { background: var(--surface-2); }
  .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .fade-in { animation: fadeIn 0.2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    background: var(--text); color: white; padding: 12px 18px;
    border-radius: 8px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<!-- =================== LOGIN =================== -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-6" style="background: linear-gradient(135deg, #F7F8FA 0%, #EEF0FF 100%);">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <svg class="rumi-logo rumi-logo-login" xmlns="http://www.w3.org/2000/svg" viewBox="120 200 1160 730" width="224" height="141" role="img" aria-label="Rumi" focusable="false">
        <use href="#rumiLogoOriginal" />
      </svg>
      <h1 class="text-2xl font-bold mb-2">Gestão de Desvios e Ações</h1>
      <p class="text-sm" style="color: var(--text-2);">Entre com sua conta corporativa</p>
    </div>
    
    <div class="bg-white p-8 rounded-xl card-shadow-lg">
      <!-- Abas -->
      <div class="flex gap-1 mb-6 p-1 rounded-lg" style="background: var(--surface-2);">
        <button id="tabEntrar" onclick="switchAuthTab('entrar')" class="flex-1 py-2 rounded-md text-sm font-medium transition" style="background: white; color: var(--accent);">Entrar</button>
        <button id="tabCriar" onclick="switchAuthTab('criar')" class="flex-1 py-2 rounded-md text-sm font-medium transition" style="color: var(--text-2);">Criar conta</button>
      </div>

      <!-- ENTRAR -->
      <div id="paneEntrar">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1.5">E-mail</label>
          <input id="loginEmail" type="email" class="input" placeholder="seu.nome@dsm-firmenich.com" autocomplete="email">
        </div>
        <div class="mb-2">
          <label class="block text-sm font-medium mb-1.5">Senha</label>
          <input id="loginPassword" type="password" class="input" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div class="mb-5 text-right">
          <button onclick="recuperarSenha()" class="text-xs hover:underline" style="color: var(--accent);">Esqueci minha senha</button>
        </div>
        <button id="btnEntrar" onclick="doLogin()" class="btn btn-primary w-full justify-center py-2.5">Entrar</button>
      </div>

      <!-- CRIAR CONTA -->
      <div id="paneCriar" class="hidden">
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1.5">Nome completo</label>
          <input id="cadNome" class="input" placeholder="João Gabriel Silva">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-1.5">E-mail</label>
          <input id="cadEmail" type="email" class="input" placeholder="seu.nome@dsm-firmenich.com" autocomplete="email">
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium mb-1.5">Criar senha</label>
          <input id="cadSenha" type="password" class="input" placeholder="mínimo 6 caracteres" autocomplete="new-password">
        </div>
        <button id="btnCriar" onclick="criarConta()" class="btn btn-primary w-full justify-center py-2.5">Criar conta e entrar</button>
      </div>

      <div id="authErro" class="hidden mt-4 p-3 rounded-md text-sm" style="background: var(--danger-soft); color: var(--danger);"></div>
      <div id="authOk" class="hidden mt-4 p-3 rounded-md text-sm" style="background: var(--ok-soft); color: var(--ok);"></div>
    </div>

    <div class="mt-4 text-center text-xs" style="color: var(--text-3);">
      Sistema interno Rumi · dados sincronizados no Google
    </div>
  </div>

// ====== COMUNICAÇÃO COM O GOOGLE ======

function apiConfigurada() {
  return API_URL && API_URL.indexOf('script.google.com') > -1;
}

async function pegarToken() {
  try {
    const u = auth?.currentUser;
    if (!u) return '';
    return await u.getIdToken();
  } catch (e) {
    console.warn('Não consegui obter o token:', e);
    return '';
  }
}

async function apiPost(corpo) {
  corpo.idToken = await pegarToken();
  corpo.nomeUsuario = state.currentUser?.name || '';
  const resp = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(corpo),
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const r = await resp.json();
  if (r && r.naoAutorizado) {
    showToast('Sessão expirada — entre de novo');
  }
  return r;
}

// ====== INDICADOR DE STATUS ======

function marcarStatusSync(estado, texto) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const n = filaEnvio.length;
  const cores = {
    ok:       { bg: 'rgba(255,255,255,0.15)', txt: '✓ ' + (texto || 'Salvo') },
    salvando: { bg: 'rgba(255,255,255,0.28)', txt: '⟳ ' + (texto || (n ? 'Enviando (' + n + ')' : 'Enviando')) },
    erro:     { bg: 'rgba(220,38,38,0.9)',    txt: '⚠ ' + (texto || 'Erro') },
    offline:  { bg: 'rgba(217,119,6,0.9)',    txt: '⚠ ' + (texto || (n ? 'Sem conexão (' + n + ' na fila)' : 'Sem conexão')) },
    local:    { bg: 'rgba(217,119,6,0.9)',    txt: '⚠ Modo local' },
  };
  const c = cores[estado] || cores.ok;
  el.style.background = c.bg;
  el.textContent = c.txt;
}

// ====== FILA DE ENVIO (persistente) ======

function carregarFila() {
  try { filaEnvio = JSON.parse(localStorage.getItem(FILA_KEY) || '[]'); }
  catch (e) { filaEnvio = []; }
}

function gravarFila() {
  try { localStorage.setItem(FILA_KEY, JSON.stringify(filaEnvio)); } catch (e) {}
}

function enfileirar(operacao) {
  if (!apiConfigurada()) return;

  // Uma operação por card: a mais nova substitui a anterior que ainda não saiu
  if (operacao.acao === 'salvarCard') {
    const chave = operacao.tipo + ':' + operacao.card.id;
    filaEnvio = filaEnvio.filter(o => !(o.acao === 'salvarCard' && (o.tipo + ':' + o.card.id) === chave));
  }
  if (operacao.acao === 'excluirCard') {
    const chave = operacao.tipo + ':' + operacao.id;
    filaEnvio = filaEnvio.filter(o => {
      const c = o.acao === 'salvarCard' ? (o.tipo + ':' + o.card.id)
              : o.acao === 'excluirCard' ? (o.tipo + ':' + o.id) : null;
      return c !== chave;
    });
  }

  operacao._id = 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
  operacao._tentativas = 0;
  operacao._proximaEm = 0;
  filaEnvio.push(operacao);
  gravarFila();
  marcarStatusSync('salvando');
  processarFila(); // tenta na hora, sem esperar o timer
}

async function processarFila() {
  if (processandoFila || !filaEnvio.length || !apiConfigurada()) return;
  if (!auth?.currentUser) return;

  processandoFila = true;
  try {
    while (filaEnvio.length) {
      const op = filaEnvio[0];
      if (op._proximaEm && Date.now() < op._proximaEm) break; // aguardando backoff

      let r;
      try {
        r = await apiPost(montarRequisicao(op));
      } catch (e) {
        // Falha de rede: espera mais um pouco e tenta de novo
        op._tentativas++;
        op._proximaEm = Date.now() + Math.min(30000, 1000 * Math.pow(2, op._tentativas));
        gravarFila();
        marcarStatusSync('offline');
        break;
      }

      if (r && r.ok) {
        aplicarRespostaOk(op, r);
        filaEnvio.shift();
        gravarFila();
        continue;
      }

      if (r && r.conflito) {
        filaEnvio.shift();
        gravarFila();
        tratarConflito(op, r);
        continue;
      }

      // Erro do servidor: tenta de novo com espera crescente
      op._tentativas++;
      if (op._tentativas >= MAX_TENTATIVAS) {
        console.warn('Operação descartada após várias tentativas:', op, r);
        showToast('Não consegui salvar uma alteração. Verifique a conexão e tente de novo.');
        filaEnvio.shift();
        gravarFila();
        continue;
      }
      op._proximaEm = Date.now() + Math.min(30000, 1000 * Math.pow(2, op._tentativas));
      gravarFila();
      marcarStatusSync('erro', 'Tentando de novo...');
      break;
    }
  } finally {
    processandoFila = false;
    if (!filaEnvio.length) marcarStatusSync('ok');
    else marcarStatusSync('salvando');
  }
}

function montarRequisicao(op) {
  if (op.acao === 'salvarCard') {
    return {
      acao: 'salvarCard', tipo: op.tipo, card: op.card,
      versaoBase: op.versaoBase,
      contadores: {
        _seqDesvio: state.data._seqDesvio || 0,
        _seqNC: state.data._seqNC || 0,
        _seqSQM: state.data._seqSQM || 0,
        _config: state.data._config || {},
      },
    };
  }
  if (op.acao === 'excluirCard') return { acao: 'excluirCard', tipo: op.tipo, id: op.id };
  return { ...op };
}

function aplicarRespostaOk(op, r) {
  if (op.acao === 'salvarCard' && r.versao) {
    const lista = getItemsByType(op.tipo === 'desvios' ? 'desvio' : op.tipo === 'acoes' ? 'acao' : op.tipo);
    const atual = (lista || []).find(c => c.id === op.card.id);
    if (atual) {
      atual._versao = r.versao;
      atual._atualizadoEm = r.atualizadoEm;
      atual._atualizadoPor = emailUsuario();
      salvarCacheLocal(state.data);
    }
  }
}

function tratarConflito(op, r) {
  const numero = op.card?.numero || op.card?.id || '';
  const quem = (r.alteradoPor || '').split('@')[0];
  const manter = confirm(
    'Conflito no card ' + numero + '\n\n' +
    (quem ? quem + ' salvou uma versão mais nova enquanto você editava.' : 'Outra pessoa salvou uma versão mais nova.') + '\n\n' +
    'OK = manter a MINHA versão (sobrescreve a dela)\n' +
    'Cancelar = descartar a minha e ficar com a versão dela'
  );

  if (manter) {
    // Reenvia com a versão do servidor, forçando a gravação
    const op2 = { ...op, versaoBase: r.versaoServidor };
    op2._id = 'op_' + Date.now();
    op2._tentativas = 0; op2._proximaEm = 0;
    filaEnvio.unshift(op2);
    gravarFila();
    processarFila();
  } else if (r.cardServidor) {
    const chave = { desvios: 'desvios', acoes: 'acoes', nc: 'nc', sqm: 'sqm', lixeira: 'lixeira' }[op.tipo];
    if (chave && state.data[chave]) {
      const i = state.data[chave].findIndex(c => c.id === op.card.id);
      const doServidor = { ...r.cardServidor, _versao: r.versaoServidor, _atualizadoPor: r.alteradoPor };
      if (i > -1) state.data[chave][i] = doServidor;
      salvarCacheLocal(state.data);
      render();
      lucide.createIcons();
    }
    showToast('Mantida a versão de ' + (quem || 'outra pessoa'));
  }
}

// ====== CARREGAR ======

const CHAVES_TIPO = { desvio: 'desvios', acao: 'acoes', nc: 'nc', sqm: 'sqm', lixeira: 'lixeira' };

// Migração leve de fases antigas para o layout novo (não perde cards).
// Roda no carregamento; se o card for editado, a nova fase é salva no servidor.
const FASES_FINAIS_SQM = ['aprovado', 'reprovado'];
function normalizarFaseCard(tipoCurto, card) {
  if (!card) return card;
  if (tipoCurto === 'desvio' && card.fase === 'rca') card.fase = 'concluido';
  if (tipoCurto === 'sqm' && card.fase === 'concluido') {
    const a = card.aprovacoes || {};
    const reprovou = ['qualidade','she','operacoes'].some(g => a[g]?.status === 'reprovado');
    card.fase = reprovou ? 'reprovado' : 'aprovado';
  }
  return card;
}
function normalizarDados(dados) {
  if (!dados) return dados;
  (dados.desvios || []).forEach(c => normalizarFaseCard('desvio', c));
  (dados.sqm || []).forEach(c => normalizarFaseCard('sqm', c));
  return dados;
}

async function carregarDados() {
  if (!apiConfigurada()) {
    marcarStatusSync('local');
    return carregarCacheLocal();
  }
  try {
    marcarStatusSync('salvando', 'Carregando...');
    const r = await apiPost({ acao: 'carregar' });
    if (!r.ok) throw new Error(r.erro || 'Falha ao carregar');

    ultimaSync = r.agora;
    guardarLocks(r.locks);
    const dados = r.dados;
    const vazio = !dados.desvios?.length && !dados.acoes?.length && !dados.nc?.length && !dados.sqm?.length;

    if (vazio) {
      const inicial = JSON.parse(JSON.stringify(seedData));
      inicial.lixeira = [];
      const rs = await apiPost({ acao: 'semear', dados: inicial });
      if (rs.agora) ultimaSync = rs.agora;
      marcarStatusSync('ok');
      salvarCacheLocal(inicial);
      return inicial;
    }

    dados.lixeira = dados.lixeira || [];
    normalizarDados(dados);
    aplicarConfigSalva(dados);
    salvarCacheLocal(dados);
    marcarStatusSync('ok');
    return dados;

  } catch (e) {
    console.warn('Erro ao carregar do Google:', e);
    marcarStatusSync('offline', 'Sem conexão — usando cópia local');
    return carregarCacheLocal();
  }
}

function aplicarConfigSalva(dados) {
  if (!dados || !dados._config) return;
  if (dados._config.emailsEquipe) Object.assign(EMAILS_EQUIPE, dados._config.emailsEquipe);
  if (Array.isArray(dados._config.responsaveis) && dados._config.responsaveis.length) {
    RESPONSAVEIS = dados._config.responsaveis.slice();
  }
}

function carregarCacheLocal() {
  try {
    const bruto = localStorage.getItem(STORAGE_KEY);
    if (bruto) {
      const d = JSON.parse(bruto);
      d.lixeira = d.lixeira || [];
      normalizarDados(d);
      aplicarConfigSalva(d);
      return d;
    }
  } catch (e) { console.warn(e); }
  const inicial = JSON.parse(JSON.stringify(seedData));
  inicial.lixeira = [];
  return inicial;
}

function salvarCacheLocal(dados) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(dados)); } catch (e) {}
}

// ====== SINCRONIZAÇÃO AUTOMÁTICA (busca só o que mudou) ======

async function buscarNovidades() {
  if (!apiConfigurada() || buscandoNovidades || !auth?.currentUser) return;
  if (filaEnvio.length) return;              // primeiro envia o meu, depois busco o dos outros
  if (state.editingCard && state.editingCard.id) return; // não mexe embaixo de quem está editando

  buscandoNovidades = true;
  try {
    const r = await apiPost({ acao: 'carregar', desde: ultimaSync });
    if (!r.ok) return;
    ultimaSync = r.agora;
    guardarLocks(r.locks);
    ultimoErroSync = null;

    let mexeu = 0;
    const nomes = new Set();

    Object.keys(CHAVES_TIPO).forEach(tipoCurto => {
      const chave = CHAVES_TIPO[tipoCurto];
      (r.dados[chave] || []).forEach(cardNovo => {
        normalizarFaseCard(tipoCurto, cardNovo);
        state.data[chave] = state.data[chave] || [];
        const i = state.data[chave].findIndex(c => c.id === cardNovo.id);
        if (i > -1) {
          if ((state.data[chave][i]._versao || 0) === (cardNovo._versao || 0)) return;
          state.data[chave][i] = cardNovo;
        } else {
          state.data[chave].push(cardNovo);
        }
        mexeu++;
        if (cardNovo._atualizadoPor && cardNovo._atualizadoPor !== emailUsuario()) {
          nomes.add(cardNovo._atualizadoPor.split('@')[0]);
        }
      });
    });

    (r.excluidos || []).forEach(ex => {
      const chave = ex.tipo;
      if (!state.data[chave]) return;
      const antes = state.data[chave].length;
      state.data[chave] = state.data[chave].filter(c => c.id !== ex.id);
      if (state.data[chave].length !== antes) mexeu++;
    });

    if (mexeu) {
      salvarCacheLocal(state.data);
      if (!document.getElementById('cardModal').classList.contains('hidden')) return;
      render();
      lucide.createIcons();
      if (nomes.size) {
        const lista = Array.from(nomes).join(', ');
        showToast(`${lista} atualizou ${mexeu === 1 ? 'um card' : mexeu + ' cards'}`);
      }
    }
    if (!filaEnvio.length) marcarStatusSync('ok');

  } catch (e) {
    ultimoErroSync = e;
    if (!filaEnvio.length) marcarStatusSync('offline');
  } finally {
    buscandoNovidades = false;
  }
}

function guardarLocks(lista) {
  locksRemotos = {};
  (lista || []).forEach(l => { locksRemotos[l.chave] = l; });
}

function lockDeOutro(tipo, id) {
  const l = locksRemotos[tipo + ':' + id];
  if (!l) return null;
  if (new Date(l.expiraEm).getTime() < Date.now()) return null;
  if (l.email === emailUsuario()) return null;
  return l;
}

function iniciarSincronizacao() {
  carregarFila();
  if (timerSync) clearInterval(timerSync);
  if (timerFila) clearInterval(timerFila);

  timerFila = setInterval(processarFila, INTERVALO_FILA);
  timerSync = setInterval(buscarNovidades, INTERVALO_SYNC);

  // Voltou a internet: tenta esvaziar a fila na hora
  window.addEventListener('online', () => { marcarStatusSync('salvando'); processarFila(); });
  window.addEventListener('offline', () => marcarStatusSync('offline'));

  // Aba voltou ao foco: busca novidades imediatamente
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { processarFila(); buscarNovidades(); }
  });

  // Fechando com algo pendente: tenta um último envio, sem perguntar nada
  window.addEventListener('pagehide', () => {
    if (!filaEnvio.length || !navigator.sendBeacon) return;
    try {
      const op = filaEnvio[0];
      const corpo = montarRequisicao(op);
      corpo.idToken = tokenCache || '';
      navigator.sendBeacon(API_URL, new Blob([JSON.stringify(corpo)], { type: 'text/plain' }));
    } catch (e) {}
  });
}

// Token guardado para o envio de última hora (sendBeacon não espera promessa)

setInterval(async () => { tokenCache = await pegarToken(); }, 30000);

let auth = null;

function iniciarFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    auth.onAuthStateChanged(usuario => {
      if (usuario) entrarNoApp(usuario);
    });
  } catch (e) {
    console.warn('Firebase não iniciou:', e);
    mostrarErroAuth('Não consegui conectar ao serviço de login. Verifique sua internet.');
  }
}

function switchAuthTab(aba) {
  const entrar = aba === 'entrar';
  document.getElementById('paneEntrar').classList.toggle('hidden', !entrar);
  document.getElementById('paneCriar').classList.toggle('hidden', entrar);
  const t1 = document.getElementById('tabEntrar'), t2 = document.getElementById('tabCriar');
  t1.style.background = entrar ? 'white' : 'transparent';
  t1.style.color = entrar ? 'var(--accent)' : 'var(--text-2)';
  t2.style.background = entrar ? 'transparent' : 'white';
  t2.style.color = entrar ? 'var(--text-2)' : 'var(--accent)';
  limparAvisosAuth();
}

function mostrarErroAuth(msg) {
  const el = document.getElementById('authErro');
  el.textContent = msg;
  el.classList.remove('hidden');
  document.getElementById('authOk').classList.add('hidden');
}
function mostrarSucessoAuth(msg) {
  const el = document.getElementById('authOk');
  el.textContent = msg;
  el.classList.remove('hidden');
  document.getElementById('authErro').classList.add('hidden');
}
function limparAvisosAuth() {
  document.getElementById('authErro').classList.add('hidden');
  document.getElementById('authOk').classList.add('hidden');
}

function traduzirErroFirebase(codigo) {
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-disabled': 'Esta conta foi desativada.',
    'auth/user-not-found': 'Não existe conta com esse e-mail. Use "Criar conta".',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Já existe conta com esse e-mail. Use "Entrar".',
    'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests': 'Muitas tentativas. Espere alguns minutos.',
    'auth/network-request-failed': 'Sem conexão com a internet.',
    'auth/operation-not-allowed': 'Login por e-mail não está ativado no Firebase.',
  };
  return mapa[codigo] || 'Não consegui entrar. Tente de novo.';
}

async function doLogin() {
  limparAvisosAuth();
  const email = document.getElementById('loginEmail').value.trim();
  const senha = document.getElementById('loginPassword').value;
  if (!email || !senha) { mostrarErroAuth('Preencha e-mail e senha.'); return; }
  if (!emailAutorizado(email)) {
    mostrarErroAuth('Só e-mails @' + DOMINIO_PERMITIDO + ' têm acesso a este sistema.');
    return;
  }
  const btn = document.getElementById('btnEntrar');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    // entrarNoApp é chamado pelo onAuthStateChanged
  } catch (e) {
    mostrarErroAuth(traduzirErroFirebase(e.code));
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function criarConta() {
  limparAvisosAuth();
  const nome = document.getElementById('cadNome').value.trim();
  const email = document.getElementById('cadEmail').value.trim();
  const senha = document.getElementById('cadSenha').value;
  if (!nome) { mostrarErroAuth('Informe seu nome completo.'); return; }
  if (!email || !senha) { mostrarErroAuth('Preencha e-mail e senha.'); return; }
  if (!emailAutorizado(email)) {
    mostrarErroAuth('Só e-mails @' + DOMINIO_PERMITIDO + ' podem criar conta neste sistema.');
    return;
  }
  if (senha.length < 6) { mostrarErroAuth('A senha precisa ter pelo menos 6 caracteres.'); return; }
  const btn = document.getElementById('btnCriar');
  btn.disabled = true; btn.textContent = 'Criando...';
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    await cred.user.updateProfile({ displayName: nome });
  } catch (e) {
    mostrarErroAuth(traduzirErroFirebase(e.code));
    btn.disabled = false; btn.textContent = 'Criar conta e entrar';
  }
}

async function recuperarSenha() {
  limparAvisosAuth();
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { mostrarErroAuth('Digite seu e-mail acima e clique de novo.'); return; }
  if (!emailAutorizado(email)) {
    mostrarErroAuth('Só e-mails @' + DOMINIO_PERMITIDO + ' têm acesso a este sistema.');
    return;
  }
  try {
    await auth.sendPasswordResetEmail(email);
    mostrarSucessoAuth('Enviei um link de redefinição para ' + email + '. Confira a caixa de entrada e o spam.');
  } catch (e) {
    mostrarErroAuth(traduzirErroFirebase(e.code));
  }
}

async function entrarNoApp(usuario) {
  // Trava final: conta de fora do domínio não entra, mesmo que tenha sido criada por outro caminho
  if (!emailAutorizado(usuario.email)) {
    try { await auth.signOut(); } catch (e) {}
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('app').classList.remove('flex');
    switchAuthTab('entrar');
    mostrarErroAuth('A conta ' + usuario.email + ' não tem acesso. Use seu e-mail @' + DOMINIO_PERMITIDO + '.');
    const b = document.getElementById('btnEntrar');
    if (b) { b.disabled = false; b.textContent = 'Entrar'; }
    return;
  }

  const nome = usuario.displayName
    || usuario.email.split('@')[0].split('.').map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(' ');
  state.currentUser = { email: usuario.email, name: nome, uid: usuario.uid };

  // Destrava os botões da tela de login
  const bE = document.getElementById('btnEntrar');
  if (bE) { bE.disabled = false; bE.textContent = 'Entrar'; }
  const bC = document.getElementById('btnCriar');
  if (bC) { bC.disabled = false; bC.textContent = 'Criar conta e entrar'; }

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('app').classList.add('flex');

  state.data = await carregarDados();
  state.data.lixeira = state.data.lixeira || [];
  atualizarIdentidadeUsuario();
  render();
  lucide.createIcons();
  iniciarSincronizacao();
  abrirCardDaURL();
  showToast('Bem-vindo, ' + nome.split(' ')[0]);
}

async function doLogout() {
  if (filaEnvio.length && apiConfigurada()) {
    marcarStatusSync('salvando', 'Salvando antes de sair...');
    await processarFila();
  }
  if (timerSync) clearInterval(timerSync);
  if (timerFila) clearInterval(timerFila);
  liberarLockAtual();
  state.currentUser = null;
  try { await auth.signOut(); } catch (e) {}
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('app').classList.remove('flex');

  // Volta a tela para o estado inicial de "Entrar"
  switchAuthTab('entrar');
  const bE = document.getElementById('btnEntrar');
  if (bE) { bE.disabled = false; bE.textContent = 'Entrar'; }
  const bC = document.getElementById('btnCriar');

  ['loginPassword', 'cadNome', 'cadEmail', 'cadSenha'].forEach(id => {

  limparAvisosAuth();
  fecharMenuConta();

// =================== LINK POR CARD ===================
function abrirCardDaURL() {
  const params = new URLSearchParams(window.location.search);
  const alvo = params.get('card');
  if (!alvo) return;

  const mapa = [
    { tipo: 'desvio', lista: state.data.desvios || [], view: 'desvios' },
    { tipo: 'acao',   lista: state.data.acoes   || [], view: 'acoes' },
    { tipo: 'nc',     lista: state.data.nc      || [], view: 'nc' },
    { tipo: 'sqm',    lista: state.data.sqm     || [], view: 'sqm' },
  ];

  for (const m of mapa) {
    const card = m.lista.find(c => c.id === alvo || c.numero === alvo);
    if (card) {
      switchView(m.view);
      setTimeout(() => openCard(card.id, m.tipo), 250);
      return;
    }
  }
  showToast('Card ' + alvo + ' não encontrado');
}

function copiarLinkDoCard() {
  const card = state.editingCard;
  if (!card || !card.id) { showToast('Salve o card antes de compartilhar'); return; }
  const base = window.location.origin + window.location.pathname;
  const link = base + '?card=' + encodeURIComponent(card.numero || card.id);

  navigator.clipboard.writeText(link).then(() => {
    showToast('Link copiado — cole no e-mail ou Teams');
  }).catch(() => {
    prompt('Copie o link abaixo:', link);
  });
}

function enviarLinkPorEmail() {
  const card = state.editingCard;
  if (!card || !card.id) { showToast('Salve o card antes de compartilhar'); return; }
  const base = window.location.origin + window.location.pathname;
  const link = base + '?card=' + encodeURIComponent(card.numero || card.id);
  const titulo = card.registro?.titulo || card.compras?.produtoMP || card.titulo || card.id;

  const corpo = `Olá,\n\nPreciso da sua ajuda neste item do sistema de gestão:\n\n` +
    `${card.numero || card.id} — ${titulo}\n\n` +
    `Abra pelo link abaixo, preencha o que for da sua parte e salve:\n${link}\n\n` +
    `Se for seu primeiro acesso, clique em "Criar conta" e cadastre uma senha.\n\n` +
    `Obrigado,\n${state.currentUser?.name || ''}`;

  sendEmail('', `[Rumi] ${card.numero || card.id} — ${titulo}`, corpo);
}

      subEl.textContent = (state.data.lixeira || []).length + ' itens · restaure ou apague de vez';
      btnNew.style.display = 'none';
      container.innerHTML = renderLixeira();
      break;
    case 'config':
      titleEl.textContent = 'Configurações';
      subEl.textContent = 'Notificações · Integrações · Backup';
      btnNew.style.display = 'none';
      container.innerHTML = renderConfig();
      break;
  }
  lucide.createIcons();
}

function atualizarIdentidadeUsuario() {
  const u = state.currentUser;
  if (!u) return;
  const iniciais = (u.name || u.email).split(' ').filter(Boolean).slice(0, 2)
    .map(p => p[0]).join('').toUpperCase();
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  set('avatarIniciais', iniciais);
  set('nomeUsuarioTopo', (u.name || '').split(' ')[0]);
  set('menuContaNome', u.name || '');
  set('menuContaEmail', u.email || '');
  set('sidebarNome', u.name || '');
  set('sidebarIniciais', iniciais);
}

function notificarTodosVencendo() {
  const vencidas = state.data.acoes.filter(a => a.fase !== 'concluido' && daysUntil(a.dataLimite) <= 3);
  if (vencidas.length === 0) { showToast('Sem ações vencendo'); return; }
  // Agrupa por responsável
  const porResp = {};
  vencidas.forEach(a => {
    porResp[a.responsavel] = porResp[a.responsavel] || [];
    porResp[a.responsavel].push(a);
  });
  const responsaveis = Object.keys(porResp);
  if (!confirm(`Vai abrir ${responsaveis.length} e-mail(s) no Outlook — 1 por responsável, com o resumo das ações dele. Continuar?`)) return;
  responsaveis.forEach((resp, i) => {
    setTimeout(() => {
      const acoes = porResp[resp];
      const corpo = `Olá ${resp},\n\nVocê tem ${acoes.length} ação(ões) urgente(s) no sistema Rumi:\n\n` +
        acoes.map(a => {
          const dias = daysUntil(a.dataLimite);
          return `• ${a.titulo}\n  Prazo: ${a.dataLimite} · ${dias < 0 ? `ATRASADA ${Math.abs(dias)}d` : dias === 0 ? 'VENCE HOJE' : `${dias}d restantes`}\n  Status: ${a.fase}`;
        }).join('\n\n') +
        `\n\nFavor verificar no sistema.\n\n— Sistema Rumi Gestão`;
      sendEmail(getEmail(resp) || (resp.toLowerCase().replace(/ /g, '.') + '@dsm-firmenich.com'),
        `[Rumi] Você tem ${acoes.length} ação(ões) urgente(s)`, corpo);
    }, i * 400); // separa cada abertura por 400ms
  });
  showToast(`Abrindo ${responsaveis.length} e-mail(s)...`);
}

function updateCounts() {
  if (!state.data) return;
  const desviosAtivos = state.data.desvios.filter(d => d.fase !== 'concluido').length;
  const acoesAtivas = state.data.acoes.filter(a => a.fase !== 'concluido').length;
  const ncAtivas = (state.data.nc || []).filter(n => n.fase !== 'concluido').length;
  const sqmAtivas = (state.data.sqm || []).filter(s => !FASES_FINAIS_SQM.includes(s.fase)).length;
  document.getElementById('desviosCount').textContent = desviosAtivos;
  document.getElementById('acoesCount').textContent = acoesAtivas;
  const ncEl = document.getElementById('ncCount');
  const sqmEl = document.getElementById('sqmCount');
  const lixEl = document.getElementById('lixeiraCount');
  if (ncEl) ncEl.textContent = ncAtivas;
  if (sqmEl) sqmEl.textContent = sqmAtivas;
  if (lixEl) lixEl.textContent = (state.data.lixeira || []).length;
}

// =================== DASHBOARD ===================
function renderDashboard() {
  const d = state.data;
  const abertos = d.desvios.filter(x => x.fase !== 'concluido');
  const totalAbertos = abertos.length;
  const criticos = abertos.filter(x => x.criticidade === 1).length;
  const atrasados = abertos.filter(x => x.diasAtraso > 0).length;
  const precisaRCA = abertos.filter(x => x.avalQualidade?.precisaRCA === 'sim').length;
  const precisaFormulacao = abertos.filter(x => x.avalQualidade?.precisaFormulacao === 'sim').length;
  const precisaComercial = abertos.filter(x => x.avalFormulacao?.precisaComercial === 'sim').length;
  
  // Agregações — todos aberto por Unidade / Área / Setor
  const porUnidade = {}, porArea = {}, porSetor = {}, porEquipamento = {};
  const porTipo = {}, porCriticidade = {};
  const anoAtual = new Date().getFullYear();
  const porMes = {}; // { '2026-01': N }
  
  abertos.forEach(x => {
    const r = x.registro || {}, aq = x.avalQualidade || {};
    if (r.unidade) porUnidade[r.unidade] = (porUnidade[r.unidade] || 0) + 1;
    const area = aq.area || r.areaEquipamento || '—';
    porArea[area] = (porArea[area] || 0) + 1;
    if (aq.setor) porSetor[aq.setor] = (porSetor[aq.setor] || 0) + 1;
    if (r.areaEquipamento) porEquipamento[r.areaEquipamento] = (porEquipamento[r.areaEquipamento] || 0) + 1;
    if (aq.tipo) porTipo[aq.tipo] = (porTipo[aq.tipo] || 0) + 1;
    const crit = CRITICIDADES.find(c => c.id === x.criticidade);
    if (crit) porCriticidade[crit.label] = (porCriticidade[crit.label] || 0) + 1;
    if (r.dataOcorrencia) {
      const dt = new Date(r.dataOcorrencia);
      if (dt.getFullYear() === anoAtual) {
        const mes = String(dt.getMonth()+1).padStart(2, '0');
        const key = anoAtual + '-' + mes;
        porMes[key] = (porMes[key] || 0) + 1;
      }
    }
  });
  
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesArray = meses.map((mes, i) => {
    const key = anoAtual + '-' + String(i+1).padStart(2, '0');
    return { mes, count: porMes[key] || 0 };
  });
  const maxMes = Math.max(...mesArray.map(x => x.count), 1);
  
  function barChart(obj, cor) {
    const entries = Object.entries(obj).sort((a,b) => b[1] - a[1]);
    if (entries.length === 0) return '<p class="text-xs italic" style="color: var(--text-3);">Sem dados.</p>';
    const max = Math.max(...entries.map(e => e[1]), 1);
    return entries.map(([k, v]) => `
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="font-medium truncate pr-2">${escapeHtml(k)}</span>
          <span class="mono">${v}</span>
        </div>
        <div class="h-1.5 rounded-full overflow-hidden" style="background: var(--surface-2);">
          <div style="width: ${(v/max)*100}%; height: 100%; background: ${cor};"></div>
        </div>
      </div>
    `).join('');
  }
  
  return `
    <div class="p-6 overflow-y-auto h-full">
      
      <!-- KPIs principais -->
      <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
        <div class="stat-card">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: var(--text-3);">Abertos</div>
          <div class="text-2xl font-bold">${totalAbertos}</div>
        </div>
        <div class="stat-card" style="border-color: var(--danger-soft); background: linear-gradient(135deg, white 0%, #FEF2F2 100%);">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: var(--danger);">Críticos</div>
          <div class="text-2xl font-bold" style="color: var(--danger);">${criticos}</div>
        </div>
        <div class="stat-card">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: var(--warn);">Atrasados</div>
          <div class="text-2xl font-bold" style="color: var(--warn);">${atrasados}</div>
        </div>
        <div class="stat-card" style="border-color: #CCFBF1;">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: var(--teal);">P/ RCA</div>
          <div class="text-2xl font-bold" style="color: var(--teal);">${precisaRCA}</div>
        </div>
        <div class="stat-card" style="border-color: var(--purple-soft);">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: var(--purple);">P/ Formulação</div>
          <div class="text-2xl font-bold" style="color: var(--purple);">${precisaFormulacao}</div>
        </div>
        <div class="stat-card" style="border-color: #FEF3C7;">
          <div class="text-xs uppercase tracking-wider font-semibold mb-1" style="color: #B45309;">P/ Comercial</div>
          <div class="text-2xl font-bold" style="color: #B45309;">${precisaComercial}</div>
        </div>
      </div>
      
      <!-- Fluxo -->
      <div class="bg-white rounded-lg border p-4 mb-6" style="border-color: var(--border);">
        <h3 class="font-bold mb-3 text-sm">Distribuição do fluxo</h3>
        <div class="flex items-center gap-2">
          ${FASES_DESVIO.map((f, idx) => {
            const count = d.desvios.filter(x => x.fase === f.id).length;
            return `
              <div class="flex-1">
                <div class="rounded-lg p-3 text-center" style="background: ${f.softBg};">
                  <div class="text-2xl font-bold" style="color: ${f.color};">${count}</div>
                  <div class="text-xs mt-1 font-medium" style="color: ${f.color};">${f.label}</div>
                </div>
              </div>
              ${idx < FASES_DESVIO.length - 1 ? '<i data-lucide="chevron-right" class="w-4 h-4" style="color: var(--text-3);"></i>' : ''}
            `;
          }).join('')}
        </div>
      </div>
      
      <!-- 6 painéis -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
        
        <div class="bg-white rounded-lg border p-4" style="border-color: var(--border);">
          <h3 class="font-bold mb-3 text-sm">Por Unidade</h3>
          <div class="space-y-2">${barChart(porUnidade, 'var(--accent)')}</div>
        </div>
        
        <div class="bg-white rounded-lg border p-4" style="border-color: var(--border);">
          <h3 class="font-bold mb-3 text-sm">Por Área</h3>
          <div class="space-y-2">${barChart(porArea, 'var(--info)')}</div>
        </div>
        
        <div class="bg-white rounded-lg border p-4" style="border-color: var(--border);">
          <h3 class="font-bold mb-3 text-sm">Por Setor</h3>
          <div class="space-y-2">${barChart(porSetor, 'var(--purple)')}</div>
        </div>
        
        <div class="bg-white rounded-lg border p-4" style="border-color: var(--border);">
          <h3 class="font-bold mb-3 text-sm">Por Equipamento</h3>
          <div class="space-y-2">${barChart(porEquipamento, 'var(--teal)')}</div>

          <h3 class="font-bold mb-3 text-sm">Por Criticidade</h3>
          <div class="space-y-2">${barChart(porCriticidade, 'var(--danger)')}</div>
        </div>
      </div>

        <div class="flex items-end gap-2 h-32">
          ${mesArray.map(m => `

              <div class="w-full rounded-t transition-all" style="background: var(--accent); height: ${(m.count/maxMes)*100}%; min-height: ${m.count > 0 ? '4px' : '0'};"></div>
              <div class="text-xs" style="color: var(--text-3);">${m.mes}</div>
            </div>
          `).join('')}
        </div>

      <!-- Desvios recentes -->

          ${abertos.slice(0, 5).map(dv => {

       : type === 'nc' ? FASES_NC
       : type === 'sqm' ? FASES_SQM
       : [];
}
function getItemsByType(type) {
  return type === 'desvio' ? state.data.desvios
       : type === 'acao' ? state.data.acoes
       : type === 'nc' ? (state.data.nc || [])
       : type === 'sqm' ? (state.data.sqm || [])
       : [];

function seloEditando(tipoCurto, id) {
  const tipo = CHAVES_TIPO[tipoCurto] || tipoCurto;
  const l = lockDeOutro(tipo, id);
  if (!l) return { classe: '', selo: '' };
  const nome = (l.nome || l.email || '').split('@')[0].split(' ')[0];
  return {
    classe: ' card-travado',
    selo: `<span class="selo-editando" title="${escapeHtml(l.nome || l.email || '')} está editando"><i data-lucide="lock" class="w-2.5 h-2.5"></i>${escapeHtml(nome)}</span>`
  };
}

function renderCardItem(item, type) {
  if (type === 'desvio') return renderCardDesvio(item);
  if (type === 'acao') return renderCardAcao(item);
  if (type === 'nc') return renderCardNC(item);
  if (type === 'sqm') return renderCardSQM(item);
  return '';
}

function renderCardDesvio(item) {
  const trava = seloEditando('desvio', item.id);
  const crit = CRITICIDADES.find(c => c.id === item.criticidade) || CRITICIDADES[2];
  const reg = item.registro || {};
  const aq = item.avalQualidade || {};

// =================== DRAG & DROP ===================
function setupDragDrop(type) {
  const cards = document.querySelectorAll('.card-item[draggable]');
  const zones = document.querySelectorAll('.drop-zone');
  
  cards.forEach(card => {
    card.addEventListener('dragstart', (e) => {
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
    });
  });
  
  zones.forEach(zone => {
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('drag-over');
    });
    zone.addEventListener('dragleave', () => {
      zone.classList.remove('drag-over');
    });
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const newFase = zone.dataset.fase;
      const cardType = zone.dataset.type;
      moveCard(id, newFase, cardType);
    });
  });
}

function moveCard(id, newFase, type) {
  const arr = getItemsByType(type);
  const card = arr.find(c => c.id === id);
  if (!card) return;

  // Se outra pessoa está com o card aberto, não deixa arrastar
  const travado = lockDeOutro(CHAVES_TIPO[type] || type, id);
  if (travado) {
    const nome = (travado.nome || travado.email || '').split('@')[0];
    showToast(`${nome} está editando este card — aguarde`);
    render();
    lucide.createIcons();
    return;
  }

  const oldFase = card.fase;
  if (oldFase === newFase) return;
  card.fase = newFase;
  // Atualiza histórico (desvios, nc, sqm têm histórico estruturado)
  if (type === 'desvio' || type === 'nc' || type === 'sqm') {
    if (!card.historico) card.historico = [];
    card.historico.push({ fase: newFase, data: new Date().toISOString().split('T')[0], duracao: '0 dias' });
  }
  saveData();
  render();
  const fases = getFasesByType(type);
  showToast(`Card movido para ${fases.find(f => f.id === newFase).label}`);
  enviarCard(type, card);
  simulateTeamsNotification(card, oldFase, newFase, type);
}

// =================== FILTER ===================
function filterItems(items, filter, type) {
  if (!filter) return items;
  const f = filter.toLowerCase().trim();
  if (f === 'atraso' && type === 'desvio') return items.filter(i => i.diasAtraso > 0 && i.fase !== 'concluido');
  if (f === 'bloqueado' && type === 'acao') return items.filter(i => i.fase === 'bloqueado');
  if (f === 'criticidade:1') return items.filter(i => i.criticidade === 1);
  if (f === 'critica' && type === 'acao') return items.filter(i => i.prioridade === 'critica');
  if ((f === 'precisarca' || f === 'p/ rca') && type === 'desvio') return items.filter(i => i.avalQualidade?.precisaRCA === 'sim');
  if ((f === 'precisaformulacao' || f === 'p/ formulação' || f === 'p/ formulacao') && type === 'desvio') return items.filter(i => i.avalQualidade?.precisaFormulacao === 'sim');
  if ((f === 'precisacomercial' || f === 'p/ comercial') && type === 'desvio') return items.filter(i => i.avalFormulacao?.precisaComercial === 'sim');
  if (f === 'aguardando' && type === 'nc') return items.filter(i => i.fase === 'aguardandoFornecedor');
  if (f === 'reprovado' && type === 'sqm') return items.filter(i => ['qualidade','she','operacoes'].some(g => i.aprovacoes?.[g]?.status === 'reprovado'));
  if (f === 'homologado' && type === 'sqm') return items.filter(i => ['qualidade','she','operacoes'].every(g => i.aprovacoes?.[g]?.status === 'aprovado'));
  // Busca genérica
  return items.filter(i => {
    if (type === 'desvio') {
      const r = i.registro || {}, aq = i.avalQualidade || {};
      return [i.numero, r.titulo, r.unidade, r.descricao, r.areaEquipamento, aq.area, aq.setor, aq.categoria, aq.tipo, i.responsavel]
        .filter(Boolean).join(' ').toLowerCase().includes(f);
    }
    if (type === 'nc') {
      const r = i.registro || {};
      return [i.numero, r.titulo, r.fornecedor, r.produto, r.lote, r.tipoNC, i.responsavel]
        .filter(Boolean).join(' ').toLowerCase().includes(f);
    }
    if (type === 'sqm') {
      const c = i.compras || {};
      return [i.numero, c.produtoMP, c.fornecedor, c.codigo, i.responsavel]
        .filter(Boolean).join(' ').toLowerCase().includes(f);
    }
    return [i.titulo, i.responsavel, i.setor, i.descricao].filter(Boolean).join(' ').toLowerCase().includes(f);
  });
}

function setFilter(f) {
  state.filter = f;
  document.getElementById('searchInput').value = f;

// =================== TRAVA DE EDIÇÃO ===================
let lockAtual = null;          // { tipo, id }
let timerRenovarLock = null;
let modoSomenteLeitura = false;

async function adquirirLock(tipoCurto, id) {
  modoSomenteLeitura = false;
  if (!apiConfigurada()) { mostrarAvisoLock(null); return; }

  const tipo = CHAVES_TIPO[tipoCurto] || tipoCurto;

  // Aviso imediato, com o que já sabemos da última sincronização
  const conhecido = lockDeOutro(tipo, id);
  if (conhecido) mostrarAvisoLock(conhecido);

  try {
    const r = await apiPost({ acao: 'travar', tipo, id });
    if (r.ok) {
      lockAtual = { tipo, id };
      modoSomenteLeitura = false;
      mostrarAvisoLock(null);
      if (timerRenovarLock) clearInterval(timerRenovarLock);
      timerRenovarLock = setInterval(() => {
        if (lockAtual) apiPost({ acao: 'renovarTrava', tipo: lockAtual.tipo, id: lockAtual.id }).catch(() => {});
      }, 25000);
    } else if (r.ocupado) {
      lockAtual = null;
      modoSomenteLeitura = true;
      mostrarAvisoLock({ nome: r.porNome, email: r.porEmail, expiraEm: r.expiraEm });
      aplicarSomenteLeitura();
    }
  } catch (e) {
    // Sem conexão: deixa editar e resolve no controle de versão
    mostrarAvisoLock(null);
  }
}

function liberarLockAtual() {
  if (timerRenovarLock) { clearInterval(timerRenovarLock); timerRenovarLock = null; }
  if (lockAtual && apiConfigurada()) {
    apiPost({ acao: 'liberarTrava', tipo: lockAtual.tipo, id: lockAtual.id }).catch(() => {});
  }
  lockAtual = null;
  modoSomenteLeitura = false;
}

function mostrarAvisoLock(info) {
  const el = document.getElementById('avisoLock');
  if (!el) return;
  if (!info) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  const nome = (info.nome || info.email || 'Outra pessoa').split('@')[0];
  el.className = 'flex items-center gap-2 px-4 py-2.5 text-sm';
  el.style.cssText = 'background: var(--warn-soft); color: #92400E; border-bottom: 1px solid var(--border);';
  el.innerHTML = `
    <i data-lucide="lock" class="w-4 h-4 flex-shrink-0"></i>
    <span class="flex-1"><strong>${escapeHtml(nome)}</strong> está editando este card agora. Você pode ver, mas não alterar.</span>
    <button onclick="tentarAssumirEdicao()" class="btn btn-secondary text-xs py-1">Tentar de novo</button>
  `;
  el.classList.remove('hidden');
  lucide.createIcons();
}

function aplicarSomenteLeitura() {
  const corpo = document.getElementById('modalBody');
  if (corpo) {
    corpo.querySelectorAll('input, select, textarea, button').forEach(el => {
      if (el.closest('#avisoLock')) return;
      el.disabled = true;
      el.style.opacity = '0.75';
    });
  }
  const btnSalvar = document.getElementById('btnSave');
  if (btnSalvar) { btnSalvar.disabled = true; btnSalvar.style.opacity = '0.5'; btnSalvar.textContent = 'Bloqueado'; }
  const btnDel = document.getElementById('btnDelete');
  if (btnDel) { btnDel.disabled = true; btnDel.style.opacity = '0.5'; }
}

async function tentarAssumirEdicao() {
  if (!state.editingCard) return;
  await adquirirLock(state.editingType, state.editingCard.id);
  if (!modoSomenteLeitura) {
    renderModal();
    showToast('Card liberado — pode editar');
  } else {
    showToast('Ainda está sendo editado');
  }
}

function renderModal() {
  const type = state.editingType;
  const card = state.editingCard || {};
  const isNew = !card.id;
  
  const titulosNovos = { desvio: 'Novo desvio', acao: 'Nova ação', nc: 'Nova NC de Fornecedor', sqm: 'Nova avaliação SQM' };
  const tituloExistente = card.registro?.titulo || card.compras?.produtoMP || card.titulo || '(sem título)';
  
  document.getElementById('modalTitle').textContent = isNew ? titulosNovos[type] : tituloExistente;
  document.getElementById('modalCardId').textContent = isNew ? 'Novo · será gerado ao salvar' : (card.numero || card.codigo || card.id);
  document.getElementById('btnDelete').classList.toggle('hidden', isNew);
  document.getElementById('btnsCompartilhar').classList.toggle('hidden', isNew);
  
  initCardFormBuffers(state.editingCard);
  
  const body = document.getElementById('modalBody');
  if (type === 'desvio') body.innerHTML = renderDesvioForm(card, isNew);
  else if (type === 'acao') body.innerHTML = renderAcaoForm(card, isNew);
  else if (type === 'nc') body.innerHTML = renderNCForm(card, isNew);
  else if (type === 'sqm') body.innerHTML = renderSQMForm(card, isNew);
  
  document.getElementById('cardModal').classList.remove('hidden');
  document.getElementById('cardModal').classList.add('flex');
  lucide.createIcons();
  if (modoSomenteLeitura) aplicarSomenteLeitura();
}

async function handleFileUpload(event) {
  const files = Array.from(event.target.files || []);
  event.target.value = '';
  if (!files.length) return;

  for (const file of files) {
    if (file.size > 20 * 1024 * 1024) {
      showToast(`"${file.name}" passa de 20 MB e foi ignorado`);
      continue;
    }

    // Placeholder enquanto envia
    const idTemp = 'anx_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    tempAnexos.push({ id: idTemp, name: file.name, size: file.size, type: file.type, enviando: true });
    refreshAnexosList();

    try {
      const base64 = await lerArquivoBase64(file);

      if (!apiConfigurada()) {
        // Modo local: guarda no próprio card (como era antes)
        const i = tempAnexos.findIndex(a => a.id === idTemp);
        tempAnexos[i] = { id: idTemp, name: file.name, size: file.size, type: file.type, data: base64 };
        refreshAnexosList();
        continue;
      }

      const r = await apiPost({
        acao: 'enviarAnexo',
        nome: file.name,
        mime: file.type,
        conteudo: base64,
        cardId: state.editingCard?.numero || state.editingCard?.id || '',
        usuario: emailUsuario(),
      });
      if (!r.ok) throw new Error(r.erro);

      const i = tempAnexos.findIndex(a => a.id === idTemp);
      tempAnexos[i] = {
        id: r.anexo.id,
        name: r.anexo.nome,
        size: r.anexo.tamanho,
        type: r.anexo.mime,
        url: r.anexo.url,
        noDrive: true,
        enviadoPor: r.anexo.enviadoPor,
      };
      refreshAnexosList();
      showToast(`"${file.name}" salvo no Drive`);

    } catch (e) {
      console.warn('Falha no upload:', e);
      tempAnexos = tempAnexos.filter(a => a.id !== idTemp);
      refreshAnexosList();
      showToast(`Não consegui enviar "${file.name}" — tente de novo`);
    }
  }
}

function lerArquivoBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function removeAnexo(id) {
  tempAnexos = tempAnexos.filter(a => a.id !== id);
  refreshAnexosList();
}

function downloadAnexo(id) {
  const a = tempAnexos.find(x => x.id === id);
  if (!a) return;
  if (a.noDrive && a.url) { window.open(a.url, '_blank'); return; }
  if (!a.data) { showToast('Arquivo indisponível'); return; }
  const link = document.createElement('a');
  link.href = a.data;
  link.download = a.name;
  link.click();
}

function refreshAnexosList() {
  const el = document.getElementById('anexosList');
  if (el) {
    el.innerHTML = renderAnexosList();
    lucide.createIcons();
  }
}

function getFileIcon(type) {
  if (!type) return 'file';
  if (type.startsWith('image/')) return 'image';
  if (type.includes('pdf')) return 'file-text';
  if (type.includes('sheet') || type.includes('excel') || type.includes('csv')) return 'file-spreadsheet';
  if (type.includes('word') || type.includes('doc')) return 'file-text';
  if (type.includes('zip') || type.includes('rar')) return 'file-archive';
  return 'file';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Toggle handlers dos radios condicionais
function onChangePrecisaFormulacao(val) {
  const el = document.getElementById('formulacaoResponsavel');
  if (el) el.classList.toggle('hidden', val !== 'sim');
}
function onChangePrecisaRCA(val) {
  const el = document.getElementById('rcaDetalhes');
  if (el) el.classList.toggle('hidden', val !== 'sim');
}

// =================== EMAIL HANDLERS ===================
function coletarDadosDesvioAtual() {
  const c = state.editingCard || {};
  return {
    numero: c.numero || '(novo)',
    titulo: c.registro?.titulo || document.getElementById('f_reg_titulo')?.value || '',
    unidade: c.registro?.unidade || document.getElementById('f_reg_unidade')?.value || '',
    descricao: c.registro?.descricao || document.getElementById('f_reg_descricao')?.value || '',
    dataOcorrencia: c.registro?.dataOcorrencia || document.getElementById('f_reg_dataOcorrencia')?.value || '',
  };
}
function enviarEmailNovaOcorrencia() {
  const d = coletarDadosDesvioAtual();
  const corpo = `Prezada equipe da Qualidade,\n\nFoi registrada uma nova ocorrência de desvio no sistema Rumi.\n\n` +
    `Nº: ${d.numero}\nTítulo: ${d.titulo}\nUnidade: ${d.unidade}\nData: ${d.dataOcorrencia}\n\nDescrição:\n${d.descricao}\n\n` +
    `Favor prosseguir com a avaliação.\n\n— Sistema Rumi Gestão`;
  sendEmail(getEmail('qualidade'), `[Rumi Desvio ${d.numero}] Nova ocorrência: ${d.titulo}`, corpo);
}
function enviarEmailAvalFormulacao() {
  const d = coletarDadosDesvioAtual();
  const resp = document.getElementById('f_aq_responsavelFormulacao')?.value || '';
  const corpo = `Prezado(a),\n\nSolicitamos avaliação da Formulação para o desvio abaixo:\n\n` +
    `Nº: ${d.numero}\nTítulo: ${d.titulo}\nUnidade: ${d.unidade}\n\nDescrição:\n${d.descricao}\n\n— Sistema Rumi Gestão`;
  sendEmail(getEmail(resp) || resp, `[Rumi Desvio ${d.numero}] Solicitação de avaliação da Formulação`, corpo);
}
function enviarEmailConvocacaoRCA() {
  const d = coletarDadosDesvioAtual();
  const envolvidos = (document.getElementById('f_aq_envolvidosRCA')?.value || '').split(',').map(x => x.trim()).filter(Boolean);
  const emails = envolvidos.map(e => getEmail(e) || e).filter(Boolean);
  const dataLimite = document.getElementById('f_aq_dataLimiteRCA')?.value || '(a definir)';
  const corpo = `Prezados,\n\nConvocamos os envolvidos para reunião de RCA (Root Cause Analysis) referente ao desvio:\n\n` +
    `Nº: ${d.numero}\nTítulo: ${d.titulo}\nUnidade: ${d.unidade}\n\n` +
    `DATA LIMITE PARA REALIZAÇÃO DA RCA: ${dataLimite}\n\nDescrição do desvio:\n${d.descricao}\n\n` +
    `Favor confirmar disponibilidade.\n\n— Sistema Rumi Gestão`;
  sendEmail(emails, `[Rumi Desvio ${d.numero}] Convocação para reunião de RCA`, corpo);
}
function enviarEmailComercialLiberacao() {
  const d = coletarDadosDesvioAtual();
  const corpo = `Prezada equipe Comercial,\n\nSolicitamos avaliação/liberação do lote referente ao desvio abaixo:\n\n` +
    `Nº: ${d.numero}\nTítulo: ${d.titulo}\nUnidade: ${d.unidade}\n\nDescrição:\n${d.descricao}\n\n` +
    `Favor retornar com a decisão sobre a liberação do lote.\n\n— Sistema Rumi Gestão`;
  sendEmail(getEmail('comercial'), `[Rumi Desvio ${d.numero}] Solicitação de liberação do lote — Comercial`, corpo);
}
function enviarEmailFormulacaoConcluida() {
  const d = coletarDadosDesvioAtual();
  const corpo = `Prezada equipe da Qualidade,\n\nA avaliação da Formulação foi concluída para o desvio:\n\n` +
    `Nº: ${d.numero}\nTítulo: ${d.titulo}\nUnidade: ${d.unidade}\n\n` +
    `Favor prosseguir com as próximas etapas do processo.\n\n— Sistema Rumi Gestão`;
  sendEmail(getEmail('qualidade'), `[Rumi Desvio ${d.numero}] Avaliação da Formulação concluída`, corpo);
}

      @media print { body { padding: 20px; } }

      @media print { .print-btn { display: none; } }
    </style></head><body>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="120 200 1160 730" width="150" height="94" role="img" aria-label="Rumi" style="display:block; margin-bottom:16px;">

      </div>

function enviarEmailFornecedorNC() {
  const c = state.editingCard || {};
  const r = c.registro || {};
  const emailDest = document.getElementById('f_nc_emailFornecedor')?.value || r.emailFornecedor;
  if (!emailDest) { showToast('Preencha o e-mail do fornecedor primeiro'); return; }
  const corpo = `Prezado(a) ${r.fornecedor || 'fornecedor'},\n\n` +
    `Estamos formalizando o registro de uma não conformidade referente ao produto abaixo:\n\n` +
    `Nº da NC: ${c.numero || '(pendente)'}\n` +
    `Produto: ${r.produto || ''}\n` +
    `Lote: ${r.lote || ''}\n` +
    `Nota Fiscal: ${r.notaFiscal || ''}\n\n` +
    `Segue em anexo o documento oficial da NC (gerado pelo nosso sistema) para preenchimento e devolução.\n\n` +
    `IMPORTANTE: por favor, devolva o documento preenchido com:\n` +
    `- Plano de ação corretiva\n- Causa raiz identificada\n- Prazo de implementação\n\n` +
    `Aguardamos retorno em até 7 dias úteis.\n\n` +
    `Atenciosamente,\nEquipe Rumi`;
  sendEmail(emailDest, `[Rumi NC ${c.numero || ''}] Registro de Não Conformidade — ${r.produto || ''}`, corpo);
}

function finalizarSQM() {

  if (!c || !c.id) return;
  const a = c.aprovacoes || {};
  const decididas = ['qualidade','she','operacoes'].filter(g => a[g]?.status === 'aprovado' || a[g]?.status === 'reprovado');
  if (decididas.length < 3) {
    if (!confirm('Nem todas as 3 gerências decidiram ainda.\n\nDeseja concluir mesmo assim com base no que está preenchido?')) return;
  }
  const reprovou = ['qualidade','she','operacoes'].some(g => a[g]?.status === 'reprovado');
  const novaFase = reprovou ? 'reprovado' : 'aprovado';
  const seletorFase = document.getElementById('f_fase');
  if (seletorFase) seletorFase.value = novaFase;
  showToast(reprovou ? 'Marcado como REPROVADO — clique em Salvar' : 'Marcado como APROVADO — clique em Salvar');

  const c = state.editingCard || {};

  'fase': 'Fase', 'criticidade': 'Criticidade', 'responsavel': 'Responsável',
  'registro.titulo': 'Título', 'registro.descricao': 'Descrição',
  'registro.fornecedor': 'Fornecedor', 'registro.produto': 'Produto',
  'registro.lote': 'Lote', 'registro.tipoNC': 'Tipo de NC',
  'registro.unidade': 'Unidade', 'registro.notaFiscal': 'Nota fiscal',
  'avaliacaoQualidade.decisaoUnidade': 'Decisão da unidade',
  'avaliacaoQualidade.causaRaiz': 'Causa raiz',
  'avaliacaoQualidade.apresentouPlano': 'Apresentou plano',
  'avaliacaoQualidade.observacao': 'Observação (Qualidade)',
  'compras.produtoMP': 'Produto/MP', 'compras.fornecedor': 'Fornecedor',
  'aprovacoes.qualidade.status': 'Aprovação Qualidade',
  'aprovacoes.she.status': 'Aprovação SHE',
  'aprovacoes.operacoes.status': 'Aprovação Operações',
  '(criacao)': 'Criação',
};

function rotularCampo(campo) {
  if (ROTULOS_CAMPOS[campo]) return ROTULOS_CAMPOS[campo];
  return campo.split('.').pop()
    .replace(/([A-Z])/g, ' $1')
    .replace(/^./, c => c.toUpperCase());
}

async function abrirHistoricoCard() {
  const card = state.editingCard;
  if (!card || !card.id) return;
  const numero = card.numero || card.id;

  const modal = document.getElementById('histModal');
  const corpo = document.getElementById('histBody');
  document.getElementById('histTitulo').textContent = 'Histórico · ' + numero;
  corpo.innerHTML = '<div class="p-8 text-center text-sm" style="color: var(--text-3);">Carregando...</div>';
  modal.classList.remove('hidden');
  modal.classList.add('flex');

  if (!apiConfigurada()) {
    corpo.innerHTML = '<div class="p-8 text-center text-sm" style="color: var(--text-3);">Histórico disponível só com sincronização ativa.</div>';
    return;
  }

  try {
    const r = await apiPost({ acao: 'historicoCard', numero });
    if (!r.ok || !r.historico?.length) {
      corpo.innerHTML = '<div class="p-8 text-center text-sm" style="color: var(--text-3);">Nenhuma alteração registrada ainda.</div>';
      return;
    }

    // Agrupa por momento + pessoa
    const grupos = [];
    r.historico.forEach(h => {
      const ultimo = grupos[grupos.length - 1];
      if (ultimo && ultimo.quando === h.quando && ultimo.quem === h.quem) ultimo.itens.push(h);
      else grupos.push({ quando: h.quando, quem: h.quem, itens: [h] });
    });

    corpo.innerHTML = `
      <div class="p-5 space-y-3">
        ${grupos.map(g => `
          <div class="border rounded-lg overflow-hidden" style="border-color: var(--border);">
            <div class="flex items-center gap-2 px-3 py-2" style="background: var(--surface-2);">
              <span class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style="background: var(--accent);">
                ${escapeHtml(g.quem.split('@')[0].slice(0, 2).toUpperCase())}
              </span>
              <span class="text-sm font-medium">${escapeHtml(g.quem.split('@')[0])}</span>
              <span class="text-xs ml-auto mono" style="color: var(--text-3);">${formatarDataHora(g.quando)}</span>
            </div>
            <div class="divide-y" style="border-color: var(--border);">
              ${g.itens.map(h => `
                <div class="px-3 py-2 text-sm">
                  <div class="text-xs font-semibold mb-1" style="color: var(--text-2);">${escapeHtml(rotularCampo(h.campo))}</div>
                  ${h.campo === '(criacao)'
                    ? '<div class="text-xs" style="color: var(--ok);">Card criado</div>'
                    : `<div class="flex items-start gap-2 text-xs">
                        <span class="flex-1 line-through" style="color: var(--text-3);">${escapeHtml(h.de || '(vazio)')}</span>
                        <i data-lucide="arrow-right" class="w-3 h-3 mt-0.5 flex-shrink-0" style="color: var(--text-3);"></i>
                        <span class="flex-1 font-medium">${escapeHtml(h.para || '(vazio)')}</span>
                      </div>`}
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>
    `;
    lucide.createIcons();
  } catch (e) {
    corpo.innerHTML = '<div class="p-8 text-center text-sm" style="color: var(--danger);">Não consegui carregar o histórico.</div>';
  }
}

function formatarDataHora(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return iso; }
}

function deleteCard() {
  if (modoSomenteLeitura) {
    showToast('Card bloqueado — outra pessoa está editando');
    return;
  }
  const type = state.editingType;
  const card = state.editingCard;
  if (!card || !card.id) return;
  if (!confirm('Mover este card para a lixeira?\n\nEle sai do quadro mas fica guardado — dá pra restaurar depois.')) return;

  const id = card.id;
  if (type === 'desvio') state.data.desvios = state.data.desvios.filter(d => d.id !== id);
  else if (type === 'acao') state.data.acoes = state.data.acoes.filter(a => a.id !== id);
  else if (type === 'nc') state.data.nc = (state.data.nc || []).filter(n => n.id !== id);
  else if (type === 'sqm') state.data.sqm = (state.data.sqm || []).filter(s => s.id !== id);

  const item = {
    id: 'LIX-' + Date.now() + '-' + id,
    tipoOriginal: type,
    numero: card.numero || card.id,
    titulo: card.registro?.titulo || card.compras?.produtoMP || card.titulo || '(sem título)',
    excluidoEm: new Date().toISOString(),
    excluidoPor: emailUsuario(),
    card: JSON.parse(JSON.stringify(card)),
  };
  state.data.lixeira = state.data.lixeira || [];
  state.data.lixeira.unshift(item);

  saveData();
  if (apiConfigurada()) {
    enviarExclusao(type, id);
    enviarCard('lixeira', item);
  }
  closeCardModal();
  render();
  showToast('Movido para a lixeira');
}
